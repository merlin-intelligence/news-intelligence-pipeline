# Project: de-dollarization monitoring (migrated from the original scripts).

project:
  name: dedollarization
  title: "De-Dollarization Intelligence Report"
  description: >
    De-dollarization and monetary realignment: erosion of the U.S. dollar's
    reserve-currency status, reserve diversification, alternative payment and
    clearing rails, non-dollar commodity invoicing, central bank gold buying and
    the weaponization of dollar-based financial infrastructure.

seeds:
  file: inputs/seeds_dedollarization.csv
  column: Keyword

keywords:
  - dedollarization
  - de-dollarization
  - dollar dominance
  - reserve currency
  - us dollar
  - multipolar currency
  - currency diversification
  - weaponization
  - financial sanctions
  - petrodollar
  - cips
  - swift alternative
  - gold reserves
  - local currency settlement

categories:
  - id: "1.1"
    name: Foreign Exchange Reserve Composition (IMF COFER)
    description: IMF COFER foreign exchange reserve composition dollar share decline renminbi euro diversification reserve assets non-traditional currencies
  - id: "1.2"
    name: International Debt & Sovereign Bond Denomination
    description: international debt sovereign bond denomination panda bonds dim sum bonds euro-denominated debt issuance cross-border loans non-USD debt
  - id: "1.3"
    name: Global Trade Finance & Payments Network (SWIFT & BIS)
    description: global trade finance payments network SWIFT payment share BIS triennial survey OTC foreign exchange turnover correspondent banking
  - id: "1.4"
    name: Treasury Convenience Yield & Swap Spread Compression
    description: treasury convenience yield swap spread compression U.S. sovereign debt premium interest rate swap spreads G10 sovereign yields
  - id: "1.5"
    name: Trade Policy Shocks & Tariff Threshold Dynamics
    description: trade policy shocks tariff threshold dynamics protectionism trade war invoicing switch safe-haven risk-off appreciation
  - id: "2.1"
    name: Central Bank Physical Gold Accumulation
    description: central bank physical gold accumulation official gold reserves bullion repatriation unfreezable hedge conflict risk gold surpassing treasuries
  - id: "2.2"
    name: Alternative Clearing Rails (CIPS & Project mBridge)
    description: alternative clearing rails CIPS project mBridge cross-border interbank payment system multi-CBDC wCBDC non-SWIFT clearing
  - id: "2.3"
    name: Commodity Invoicing & Petroyuan Realignment
    description: commodity invoicing petroyuan petrodollar agreement saudi arabia crude oil LNG trade settlement strait of hormuz transit fees
  - id: "2.4"
    name: Non-USD Stablecoins & Digital Sovereign Assets
    description: non-USD stablecoins digital sovereign assets digital yuan digital euro tokenized bank deposits cross-border P2P payments
  - id: "2.5"
    name: Covered Interest Parity Deviations & Auction Thinning
    description: covered interest parity CIP deviations treasury auction thinning indirect bidder allocations dollar liquidity borrowing premium
  - id: "2.6"
    name: Bilateral Swap Networks & Green RMB Bonds
    description: bilateral currency swap networks green RMB bonds central bank swap facility swap line liquidity backstop ESG safe asset
  - id: "2.7"
    name: Institutional Credibility & Central Bank Governance
    description: institutional credibility central bank governance federal reserve independence policy interference monetary authority trust

