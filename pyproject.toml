[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsintel"
version = "2.0.0"
description = "Topic-agnostic news harvesting, ranking and reporting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "eigenmind>=0.1.1",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "playwright>=1.40",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "streamlit>=1.40"]

[project.scripts]
newsintel = "newsintel.cli:main"

[tool.setuptools.packages.find]
include = ["newsintel*"]

[tool.setuptools.package-data]
newsintel = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
